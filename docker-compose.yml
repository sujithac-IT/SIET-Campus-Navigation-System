version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: siet_postgis_db
    environment:
      POSTGRES_USER: siet_admin
      POSTGRES_PASSWORD: siet_secure_password_2026
      POSTGRES_DB: siet_campus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siet_admin -d siet_campus_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - siet_network

  redis:
    image: redis:7-alpine
    container_name: siet_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - siet_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: siet_server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://siet_admin:siet_secure_password_2026@postgres:5432/siet_campus_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: siet_super_secret_jwt_access_key_min_32_chars_2026
      JWT_REFRESH_SECRET: siet_super_secret_jwt_refresh_key_min_32_chars_2026
      COOKIE_SECRET: siet_cookie_secret_passphrase_2026
      CLIENT_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - siet_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: siet_client
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - siet_network

volumes:
  postgres_data:
  redis_data:

networks:
  siet_network:
    driver: bridge
